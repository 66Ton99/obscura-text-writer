# WAITLIST-001: the paid-version waitlist Worker (Cloudflare Workers Free).
# TURNSTILE_SECRET is set only with `npx wrangler secret put TURNSTILE_SECRET`, never in this file.
# database_id is written here by the owner after `npx wrangler d1 create obscura-waitlist --jurisdiction=eu`.
name = "obscura-waitlist"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://obscurawriter.com"
RETENTION_MONTHS = "24"
# Date of the Privacy edition the consent checkbox refers to (docs/site/uk/privacy.md).
PRIVACY_EDITION = "2026-11-16"

[[d1_databases]]
binding = "DB"
database_name = "obscura-waitlist"
database_id = "2df99118-a20a-4fd9-9f6b-d9b2c48e1742"

# Daily deletion of rows older than RETENTION_MONTHS (WAITLIST-001-S09).
[triggers]
crons = ["17 3 * * *"]

[[routes]]
pattern = "waitlist.obscurawriter.com"
custom_domain = true
